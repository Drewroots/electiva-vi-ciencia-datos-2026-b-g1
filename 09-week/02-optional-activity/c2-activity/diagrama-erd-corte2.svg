<text x="50" y="660" font-size="12" fill="#4b5563">Lado 1 obligatorio: cada FK es NOT NULL, así que toda métrica pertenece a exactamente un país, álbum, género y plan; UNIQUE(country_id, album_id, genero_id, plan_id).</text>
