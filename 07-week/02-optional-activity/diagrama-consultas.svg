<text x="1070" y="375" text-anchor="start" font-size="11.2" font-weight="400" fill="#334155">promedio por registro</text>
<rect x="948" y="402" width="4" height="48" rx="2" fill="#b45309"/>
<text x="962" y="432" text-anchor="start" font-size="19" font-weight="700" fill="#b45309">16–23 %</text>
<text x="1070" y="421" text-anchor="start" font-size="11.2" font-weight="400" fill="#334155">rango del skip promedio por país:</text>
<text x="1070" y="439" text-anchor="start" font-size="11.2" font-weight="400" fill="#334155">el abandono no separa a los mercados</text>
<line x1="40" y1="700" x2="1320" y2="700" stroke="#e2e8f0"/>
<text x="40" y="726" text-anchor="start" font-size="11.5" font-weight="400" fill="#475569">WHERE filtra filas · JOIN combina tablas por PK–FK (cada una con su ON) · GROUP BY agrupa para agregar con COUNT, SUM y AVG [1], [3], [4].</text>
