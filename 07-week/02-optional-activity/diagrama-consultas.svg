<rect x="930" y="96" width="390" height="376" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="948" y="124" text-anchor="start" font-size="14" font-weight="700" fill="#0f172a">Qué dicen los resultados</text>
<rect x="948" y="146" width="4" height="48" rx="2" fill="#0369a1"/>
<text x="962" y="176" text-anchor="start" font-size="19" font-weight="700" fill="#0369a1">4,8 %</text>
<text x="1070" y="165" text-anchor="start" font-size="11.2" font-weight="400" fill="#334155">de los registros mezcla alta demanda con</text>
<text x="1070" y="183" text-anchor="start" font-size="11.2" font-weight="400" fill="#334155">alto abandono: foco de curaduría</text>
