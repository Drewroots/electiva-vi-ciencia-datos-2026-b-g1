<rect x="320" y="96" width="560" height="170" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
<path d="M320,106 a10,10 0 0 1 10,-10 h540 a10,10 0 0 1 10,10 v22 h-560 z" fill="#0369a1"/>
<text x="334" y="117" text-anchor="start" font-size="13.5" font-weight="700" fill="#ffffff">Q1 · WHERE</text>
<text x="866" y="117" text-anchor="end" font-size="10.5" font-weight="700" fill="#ffffff">FILTRA FILAS</text>
<rect x="332" y="138" width="536" height="60" rx="6" fill="#0f172a"/>
<text x="342" y="158" text-anchor="start" font-size="11.2" font-weight="400" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">SELECT metric_id, country_id, album_id, streams_30d_m, skip_rate_pct</text>
<text x="342" y="174" text-anchor="start" font-size="11.2" font-weight="400" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">FROM   metrica_streaming</text>
<text x="342" y="190" text-anchor="start" font-size="11.2" font-weight="400" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">WHERE  skip_rate_pct &gt; 30 AND streams_30d_m &gt; 150;</text>
<text x="334" y="218" text-anchor="start" font-size="11.5" font-weight="700" fill="#0369a1">Responde:</text>
<text x="402" y="218" text-anchor="start" font-size="11.5" font-weight="400" fill="#334155">¿qué registros tienen alta demanda y alto abandono?</text>
<rect x="332" y="227" width="536" height="24" rx="6" fill="#e0f2fe"/>
<text x="342" y="244" text-anchor="start" font-size="11.5" font-weight="700" fill="#0f172a">24 de 500 registros (4,8 %) · máximo: SZA · SOS en Germany, 39,14 % de skip</text>
<rect x="320" y="286" width="560" height="186" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
<path d="M320,296 a10,10 0 0 1 10,-10 h540 a10,10 0 0 1 10,10 v22 h-560 z" fill="#15803d"/>
<text x="334" y="307" text-anchor="start" font-size="13.5" font-weight="700" fill="#ffffff">Q2 · JOIN</text>
<text x="866" y="307" text-anchor="end" font-size="10.5" font-weight="700" fill="#ffffff">UNE TABLAS POR SUS CLAVES</text>
<rect x="332" y="328" width="536" height="76" rx="6" fill="#0f172a"/>
<text x="342" y="348" text-anchor="start" font-size="11.2" font-weight="400" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">FROM metrica_streaming m</text>
<text x="342" y="364" text-anchor="start" font-size="11.2" font-weight="400" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">JOIN pais p     ON p.country_id = m.country_id</text>
<text x="342" y="380" text-anchor="start" font-size="11.2" font-weight="400" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">JOIN album al   ON al.album_id  = m.album_id</text>
<text x="342" y="396" text-anchor="start" font-size="11.2" font-weight="400" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">JOIN artista ar ON ar.artist_id = al.artist_id  -- + plan</text>
<text x="334" y="424" text-anchor="start" font-size="11.5" font-weight="700" fill="#15803d">Responde:</text>
<text x="402" y="424" text-anchor="start" font-size="11.5" font-weight="400" fill="#334155">¿qué país–artista–álbum concentra más demanda?</text>
<rect x="332" y="433" width="536" height="24" rx="6" fill="#dcfce7"/>
<text x="342" y="450" text-anchor="start" font-size="11.5" font-weight="700" fill="#0f172a">Top: Italy · Taylor Swift · 1989 (Taylor's Version) · 200,00 M en 30 días</text>
<rect x="320" y="492" width="560" height="186" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
<path d="M320,502 a10,10 0 0 1 10,-10 h540 a10,10 0 0 1 10,10 v22 h-560 z" fill="#6d28d9"/>
<text x="334" y="513" text-anchor="start" font-size="13.5" font-weight="700" fill="#ffffff">Q3 · GROUP BY</text>
<text x="866" y="513" text-anchor="end" font-size="10.5" font-weight="700" fill="#ffffff">AGRUPA Y AGREGA</text>
<rect x="332" y="534" width="536" height="76" rx="6" fill="#0f172a"/>
<text x="342" y="554" text-anchor="start" font-size="11.2" font-weight="400" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">SELECT p.nombre, COUNT(*), SUM(m.streams_30d_m),</text>
<text x="342" y="570" text-anchor="start" font-size="11.2" font-weight="400" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">       AVG(m.streams_30d_m), AVG(m.skip_rate_pct)</text>
<text x="342" y="586" text-anchor="start" font-size="11.2" font-weight="400" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">FROM metrica_streaming m JOIN pais p ON p.country_id = m.country_id</text>
<text x="342" y="602" text-anchor="start" font-size="11.2" font-weight="400" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">GROUP BY p.nombre ORDER BY 3 DESC;</text>
<text x="334" y="630" text-anchor="start" font-size="11.5" font-weight="700" fill="#6d28d9">Responde:</text>
<text x="402" y="630" text-anchor="start" font-size="11.5" font-weight="400" fill="#334155">¿cuánta demanda y abandono tiene cada país?</text>
<rect x="332" y="639" width="536" height="24" rx="6" fill="#ede9fe"/>
<text x="342" y="656" text-anchor="start" font-size="11.5" font-weight="700" fill="#0f172a">20 países · líder: Italy, 3 227,25 M (34 registros)</text>
<line x1="270" y1="181" x2="316" y2="181" stroke="#475569" stroke-width="2.2" marker-end="url(#ar)"/>
<line x1="270" y1="379" x2="316" y2="379" stroke="#475569" stroke-width="2.2" marker-end="url(#ar)"/>
<line x1="270" y1="585" x2="316" y2="585" stroke="#475569" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="930" y="492" width="390" height="186" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<path d="M930,502 a10,10 0 0 1 10,-10 h370 a10,10 0 0 1 10,10 v22 h-390 z" fill="#b45309"/>
<text x="944" y="513" text-anchor="start" font-size="13.5" font-weight="700" fill="#ffffff">Equivalente en pandas [5], [6]</text>
<rect x="942" y="534" width="366" height="92" rx="6" fill="#0f172a"/>
<text x="952" y="554" text-anchor="start" font-size="11.2" font-weight="400" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">m.merge(p, on='country_id')     # JOIN</text>
<text x="952" y="570" text-anchor="start" font-size="11.2" font-weight="400" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace"> .groupby('nombre')             # GROUP BY</text>
<text x="952" y="586" text-anchor="start" font-size="11.2" font-weight="400" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace"> .agg(count, sum, mean, mean)   # COUNT/SUM/AVG</text>
<text x="952" y="602" text-anchor="start" font-size="11.2" font-weight="400" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace"> .round(2).sort_values(...)     # ORDER BY</text>
<text x="952" y="618" text-anchor="start" font-size="11.2" font-weight="400" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace"></text>
<rect x="942" y="638" width="366" height="26" rx="6" fill="#dcfce7"/>
<text x="954" y="656" text-anchor="start" font-size="11.5" font-weight="700" fill="#14532d">✓ assert_frame_equal: 20 países × 5 columnas idénticos</text>
