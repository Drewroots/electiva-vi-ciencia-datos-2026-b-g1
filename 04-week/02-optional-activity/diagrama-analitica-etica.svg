<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="900" fill="#f8fafc"/>

  <!-- Title -->
  <text x="620" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Analítica aplicada y ética de datos</text>
  <text x="620" y="63" text-anchor="middle" font-size="13.5" fill="#64748b">Caso Spotify — capacidad de streaming y curaduría regional</text>

  <!-- ===== Section 1: 4 tipos de analítica ===== -->
  <text x="40" y="100" font-size="16" font-weight="700" fill="#1e293b">1. Una pregunta por tipo de analítica [2]</text>

  <!-- Card 1: Descriptiva -->
  <g>
    <rect x="40" y="120" width="280" height="230" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <rect x="40" y="120" width="280" height="34" rx="10" fill="#0891b2"/>
    <rect x="40" y="136" width="280" height="18" fill="#0891b2"/>
    <text x="180" y="143" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Descriptiva</text>
    <text x="180" y="172" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0e7490">¿Qué pasó / qué está pasando?</text>
    <text x="58" y="198" font-size="11.5" fill="#334155" font-style="italic">"¿Cuáles son los países y</text>
    <text x="58" y="215" font-size="11.5" fill="#334155" font-style="italic">artistas con más horas de</text>
    <text x="58" y="232" font-size="11.5" fill="#334155" font-style="italic">streaming en el último</text>
    <text x="58" y="249" font-size="11.5" fill="#334155" font-style="italic">trimestre?"</text>
    <rect x="58" y="300" width="244" height="34" rx="6" fill="#ecfeff" stroke="#67e8f9" stroke-width="1"/>
    <text x="180" y="321" text-anchor="middle" font-size="10.5" fill="#0e7490">No requiere ML</text>
  </g>

  <!-- Card 2: Diagnóstica -->
  <g>
    <rect x="330" y="120" width="280" height="230" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="330" y="120" width="280" height="34" rx="10" fill="#4f46e5"/>
    <rect x="330" y="136" width="280" height="18" fill="#4f46e5"/>
    <text x="470" y="143" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Diagnóstica</text>
    <text x="470" y="172" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3730a3">¿Por qué pasó?</text>
    <text x="348" y="198" font-size="11.5" fill="#334155" font-style="italic">"¿Por qué cayeron las</text>
    <text x="348" y="215" font-size="11.5" fill="#334155" font-style="italic">horas de streaming en un</text>
    <text x="348" y="232" font-size="11.5" fill="#334155" font-style="italic">país específico durante</text>
    <text x="348" y="249" font-size="11.5" fill="#334155" font-style="italic">un periodo (precio,</text>
    <text x="348" y="266" font-size="11.5" fill="#334155" font-style="italic">competencia, evento)?"</text>
    <rect x="348" y="300" width="244" height="34" rx="6" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
    <text x="470" y="321" text-anchor="middle" font-size="10.5" fill="#3730a3">Análisis exploratorio</text>
  </g>

  <!-- Card 3: Predictiva -->
  <g>
    <rect x="620" y="120" width="280" height="230" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <rect x="620" y="120" width="280" height="34" rx="10" fill="#2563eb"/>
    <rect x="620" y="136" width="280" height="18" fill="#2563eb"/>
    <text x="760" y="143" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Predictiva ★</text>
    <text x="760" y="172" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">¿Qué va a pasar?</text>
    <text x="638" y="198" font-size="11.5" fill="#334155" font-style="italic">"¿Cuántas horas de</text>
    <text x="638" y="215" font-size="11.5" fill="#334155" font-style="italic">streaming se esperan por</text>
    <text x="638" y="232" font-size="11.5" fill="#334155" font-style="italic">país en el próximo</text>
    <text x="638" y="249" font-size="11.5" fill="#334155" font-style="italic">trimestre?"</text>
    <rect x="638" y="300" width="244" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="760" y="321" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">ML supervisado [3]</text>
  </g>

  <!-- Card 4: Prescriptiva -->
  <g>
    <rect x="910" y="120" width="280" height="230" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
    <rect x="910" y="120" width="280" height="34" rx="10" fill="#d97706"/>
    <rect x="910" y="136" width="280" height="18" fill="#d97706"/>
    <text x="1050" y="143" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Prescriptiva ★</text>
    <text x="1050" y="172" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400e">¿Qué debería hacerse?</text>
    <text x="928" y="198" font-size="11.5" fill="#334155" font-style="italic">"¿En qué región conviene</text>
    <text x="928" y="215" font-size="11.5" fill="#334155" font-style="italic">invertir primero en</text>
    <text x="928" y="232" font-size="11.5" fill="#334155" font-style="italic">capacidad de servidor,</text>
    <text x="928" y="249" font-size="11.5" fill="#334155" font-style="italic">según costo-beneficio?"</text>
    <rect x="928" y="300" width="244" height="34" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="1050" y="321" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400e">ML no supervisado [3]</text>
  </g>

  <!-- ===== Section 2: ML justification ===== -->
  <text x="40" y="390" font-size="16" font-weight="700" fill="#1e293b">2. ¿Supervisado o no supervisado? [3]</text>

  <rect x="40" y="410" width="565" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="58" y="436" font-size="12.5" font-weight="700" fill="#1e3a8a">Predictiva → ML supervisado</text>
  <text x="58" y="458" font-size="11.5" fill="#334155">Se dispone de históricos etiquetados: horas reales</text>
  <text x="58" y="474" font-size="11.5" fill="#334155">de streaming por país y periodo (Kaggle). El modelo</text>
  <text x="58" y="490" font-size="11.5" fill="#334155">aprende la relación entre variables de entrada</text>
  <text x="58" y="506" font-size="11.5" fill="#334155">(país, temporada, artista) y la salida conocida</text>
  <text x="58" y="522" font-size="11.5" fill="#334155">(horas futuras), típico de regresión/forecasting [3].</text>
  <text x="58" y="544" font-size="11.5" fill="#334155">No se dispone de "regiones a invertir" que se busca descubrir.</text>

  <rect x="615" y="410" width="565" height="150" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="633" y="436" font-size="12.5" font-weight="700" fill="#92400e">Prescriptiva → ML no supervisado</text>
  <text x="633" y="458" font-size="11.5" fill="#334155">No existe una etiqueta previa de "prioridad correcta"</text>
  <text x="633" y="474" font-size="11.5" fill="#334155">de inversión por región. Se usa clustering para</text>
  <text x="633" y="490" font-size="11.5" fill="#334155">agrupar países con patrones de consumo similares</text>
  <text x="633" y="506" font-size="11.5" fill="#334155">(volumen, crecimiento, variedad de artistas) [3], y</text>
  <text x="633" y="522" font-size="11.5" fill="#334155">sobre esos grupos se aplican reglas de optimización</text>
  <text x="633" y="538" font-size="11.5" fill="#334155">costo-beneficio para priorizar la inversión.</text>

  <!-- ===== Section 3: Ethical risk ===== -->
  <text x="40" y="600" font-size="16" font-weight="700" fill="#1e293b">3. Sesgo / riesgo ético identificado</text>

  <rect x="40" y="620" width="1160" height="250" rx="10" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="650" font-size="15" font-weight="700" fill="#9f1239">Sesgo geográfico en el modelo predictivo [4]</text>

  <text x="60" y="680" font-size="12.5" font-weight="700" fill="#1e293b">Riesgo:</text>
  <text x="60" y="698" font-size="12" fill="#334155">el histórico de streaming está dominado por mercados grandes y con más datos (EE. UU., Reino Unido,</text>
  <text x="60" y="714" font-size="12" fill="#334155">Europa Occidental). Un modelo entrenado así puede aprender patrones que no generalizan a mercados</text>
  <text x="60" y="730" font-size="12" fill="#334155">emergentes con menor volumen histórico, subestimando su crecimiento real. La consecuencia es</text>
  <text x="60" y="746" font-size="12" fill="#334155">postergar inversión en capacidad de servidores en esas regiones, perpetuando una brecha de calidad</text>
  <text x="60" y="762" font-size="12" fill="#334155">de servicio entre mercados "ricos en datos" y "pobres en datos" [4].</text>

  <text x="60" y="792" font-size="12.5" font-weight="700" fill="#1e293b">Mitigación:</text>
  <text x="60" y="810" font-size="12" fill="#334155">1) muestreo estratificado por región al entrenar, evitando que los mercados grandes dominen el ajuste;</text>
  <text x="60" y="826" font-size="12" fill="#334155">2) evaluar el error del modelo desagregado por país (no solo el error agregado global), para detectar</text>
  <text x="60" y="842" font-size="12" fill="#334155">mercados donde predice mal; 3) auditar periódicamente el modelo con datos reales por región y</text>
  <text x="60" y="858" font-size="12" fill="#334155">documentar el tratamiento de los datos de comportamiento de usuario conforme a principios de ética de datos [5].</text>

  <!-- Footer -->
  <line x1="40" y1="880" x2="1200" y2="880" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="895" font-size="10.5" fill="#64748b">Elaboración propia a partir de [1]–[5]. Ver referencias completas en README.md.</text>
</svg>
