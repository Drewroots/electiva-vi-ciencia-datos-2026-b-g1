<text x="420" y="610" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6d28d9">N:M  PAIS ↔ ALBUM</text>
<text x="505" y="611" text-anchor="start" font-size="12" font-weight="400" fill="#3b0764">Un país escucha muchos álbumes (10 a 15) y un álbum se escucha en muchos países (14 a 19).</text>
<text x="324" y="637" text-anchor="start" font-size="12" font-weight="400" fill="#3b0764">La relación no se puede guardar directamente: METRICA_STREAMING la divide en dos relaciones 1:N, lleva la FK de cada lado</text>
<text x="324" y="657" text-anchor="start" font-size="12" font-weight="400" fill="#3b0764">y además sus propios atributos (oyentes, streams, horas, skip rate), que no pertenecen ni al país ni al álbum [2], [3].</text>
