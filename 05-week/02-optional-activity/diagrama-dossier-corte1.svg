<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 950" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="950" fill="#f8fafc"/>

  <!-- Title -->
  <text x="650" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Dossier de fundamentos — Mapa del Corte 1</text>
  <text x="650" y="58" text-anchor="middle" font-size="13.5" fill="#64748b">Caso integrador: capacidad de streaming y curaduría regional en Spotify</text>

  <!-- connector lines to center -->
  <line x1="600" y1="400" x2="560" y2="440" stroke="#94a3b8" stroke-width="2"/>
  <line x1="700" y1="400" x2="740" y2="440" stroke="#94a3b8" stroke-width="2"/>
  <line x1="600" y1="550" x2="560" y2="510" stroke="#94a3b8" stroke-width="2"/>
  <line x1="700" y1="550" x2="740" y2="510" stroke="#94a3b8" stroke-width="2"/>

  <!-- Center hub -->
  <circle cx="650" cy="475" r="95" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <text x="650" y="462" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Caso</text>
  <text x="650" y="479" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">integrador</text>
  <text x="650" y="500" text-anchor="middle" font-size="10" fill="#475569">Spotify —</text>
  <text x="650" y="514" text-anchor="middle" font-size="10" fill="#475569">streaming</text>

  <!-- ===== S1: Pregunta + Decisión (top-left, indigo) ===== -->
  <g>
    <rect x="60" y="80" width="540" height="320" rx="12" fill="#ffffff" stroke="#4338ca" stroke-width="2.5"/>
    <rect x="60" y="80" width="540" height="38" rx="12" fill="#4338ca"/>
    <rect x="60" y="98" width="540" height="20" fill="#4338ca"/>
    <text x="330" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">S1 · Encuadre: pregunta y decisión</text>

    <text x="80" y="145" font-size="11.5" font-weight="700" fill="#3730a3">Pregunta de negocio</text>
    <text x="80" y="165" font-size="11" fill="#334155" font-style="italic">"¿En qué países y momentos del año</text>
    <text x="80" y="181" font-size="11" fill="#334155" font-style="italic">crecerá la demanda de streaming, para</text>
    <text x="80" y="197" font-size="11" fill="#334155" font-style="italic">escalar servidores y priorizar contenido?"</text>

    <text x="80" y="230" font-size="11.5" font-weight="700" fill="#3730a3">Decisión esperada</text>
    <text x="80" y="250" font-size="11" fill="#334155">• Escalar capacidad de servidores/CDN</text>
    <text x="80" y="266" font-size="11" fill="#334155">  por región con antelación</text>
    <text x="80" y="286" font-size="11" fill="#334155">• Priorizar curaduría de playlists y</text>
    <text x="80" y="302" font-size="11" fill="#334155">  campañas por mercado</text>

    <rect x="80" y="325" width="500" height="58" rx="6" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
    <text x="94" y="345" font-size="10.5" fill="#3730a3">Servicio (no industria física): amplía el</text>
    <text x="94" y="362" font-size="10.5" fill="#3730a3">enunciado hacia el sector servicios [1]</text>
  </g>

  <!-- ===== S2: Datos + V's (top-right, cyan) ===== -->
  <g>
    <rect x="700" y="80" width="540" height="320" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/>
    <rect x="700" y="80" width="540" height="38" rx="12" fill="#0891b2"/>
    <rect x="700" y="98" width="540" height="20" fill="#0891b2"/>
    <text x="970" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">S2 · Datos y V del Big Data</text>

    <text x="720" y="145" font-size="11.5" font-weight="700" fill="#0e7490">7 fuentes clasificadas [1]</text>
    <text x="720" y="165" font-size="11" fill="#334155">2 estructuradas · 3 semiestructuradas ·</text>
    <text x="720" y="181" font-size="11" fill="#334155">2 no estructuradas (CSV, JSON, logs,</text>
    <text x="720" y="197" font-size="11" fill="#334155">audio, reseñas)</text>

    <text x="720" y="228" font-size="11.5" font-weight="700" fill="#0e7490">V críticas [3]</text>
    <g font-size="10">
      <rect x="720" y="238" width="88" height="22" rx="5" fill="#fee2e2" stroke="#dc2626"/>
      <text x="764" y="253" text-anchor="middle" fill="#7f1d1d" font-weight="700">Volumen</text>
      <rect x="815" y="238" width="88" height="22" rx="5" fill="#fee2e2" stroke="#dc2626"/>
      <text x="859" y="253" text-anchor="middle" fill="#7f1d1d" font-weight="700">Velocidad</text>
      <rect x="910" y="238" width="88" height="22" rx="5" fill="#fee2e2" stroke="#dc2626"/>
      <text x="954" y="253" text-anchor="middle" fill="#7f1d1d" font-weight="700">Variedad</text>
      <rect x="720" y="266" width="88" height="22" rx="5" fill="#fee2e2" stroke="#dc2626"/>
      <text x="764" y="281" text-anchor="middle" fill="#7f1d1d" font-weight="700">Veracidad</text>
      <rect x="815" y="266" width="88" height="22" rx="5" fill="#fef3c7" stroke="#d97706"/>
      <text x="859" y="281" text-anchor="middle" fill="#78350f" font-weight="700">Valor (media)</text>
    </g>

    <rect x="720" y="305" width="500" height="78" rx="6" fill="#ecfeff" stroke="#67e8f9" stroke-width="1"/>
    <text x="734" y="325" font-size="10.5" fill="#0e7490">Reto de veracidad: reproducciones</text>
    <text x="734" y="341" font-size="10.5" fill="#0e7490">infladas por bots/duplicados → validar</text>
    <text x="734" y="357" font-size="10.5" fill="#0e7490">duración de escucha y detectar picos</text>
    <text x="734" y="373" font-size="10.5" fill="#0e7490">atípicos por país/IP</text>
  </g>

  <!-- ===== S3: Arquitectura (bottom-left, purple) ===== -->
  <g>
    <rect x="60" y="550" width="540" height="320" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
    <rect x="60" y="550" width="540" height="38" rx="12" fill="#7c3aed"/>
    <rect x="60" y="568" width="540" height="20" fill="#7c3aed"/>
    <text x="330" y="575" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">S3 · Arquitectura de datos propuesta</text>

    <text x="80" y="615" font-size="11.5" font-weight="700" fill="#4c1d95">Decisión: híbrida (lakehouse + Lambda) [1]</text>
    <text x="80" y="635" font-size="11" fill="#334155">Data Lake (crudo: audio, logs, eventos)</text>
    <text x="80" y="651" font-size="11" fill="#334155">→ curación/ETL → Data Warehouse</text>
    <text x="80" y="667" font-size="11" fill="#334155">(curado, listo para BI)</text>

    <text x="80" y="698" font-size="11.5" font-weight="700" fill="#4c1d95">Ruta streaming vs. batch</text>
    <text x="80" y="718" font-size="11" fill="#334155">Streaming: Kafka → Spark Streaming</text>
    <text x="80" y="734" font-size="11" fill="#334155">(capacidad en tiempo real)</text>
    <text x="80" y="754" font-size="11" fill="#334155">Batch: Airflow → Spark batch</text>
    <text x="80" y="770" font-size="11" fill="#334155">(forecast trimestral)</text>

    <rect x="80" y="795" width="500" height="55" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="94" y="815" font-size="10.5" fill="#4c1d95">BI: Power BI — dashboards de capacidad</text>
    <text x="94" y="831" font-size="10.5" fill="#4c1d95">regional y curaduría de contenido</text>
  </g>

  <!-- ===== S4: Analítica + Ética (bottom-right, amber/red) ===== -->
  <g>
    <rect x="700" y="550" width="540" height="320" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
    <rect x="700" y="550" width="540" height="38" rx="12" fill="#d97706"/>
    <rect x="700" y="568" width="540" height="20" fill="#d97706"/>
    <text x="970" y="575" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">S4 · Analítica objetivo y riesgo ético</text>

    <text x="720" y="615" font-size="11.5" font-weight="700" fill="#92400e">Analítica objetivo [4]</text>
    <text x="720" y="635" font-size="11" fill="#334155">Descriptiva: ranking actual de países</text>
    <text x="720" y="651" font-size="11" fill="#334155">Predictiva (foco): forecast trimestral</text>
    <text x="720" y="667" font-size="11" fill="#334155">Prescriptiva (opcional): priorizar inversión</text>

    <rect x="720" y="690" width="500" height="160" rx="6" fill="#fff1f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="734" y="710" font-size="11.5" font-weight="700" fill="#9f1239">Riesgo ético: sesgo geográfico [5]</text>
    <text x="734" y="728" font-size="10.5" fill="#334155">El histórico está dominado por mercados</text>
    <text x="734" y="744" font-size="10.5" fill="#334155">grandes; el modelo puede subestimar el</text>
    <text x="734" y="760" font-size="10.5" fill="#334155">crecimiento de mercados emergentes y</text>
    <text x="734" y="776" font-size="10.5" fill="#334155">postergar su inversión en infraestructura.</text>
    <text x="734" y="798" font-size="10.5" font-weight="700" fill="#9f1239">Mitigación:</text>
    <text x="734" y="814" font-size="10.5" fill="#334155">muestreo estratificado por región +</text>
    <text x="734" y="830" font-size="10.5" fill="#334155">evaluación de error desagregada por país</text>
  </g>

  <!-- Footer -->
  <line x1="60" y1="900" x2="1240" y2="900" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="922" font-size="11" fill="#64748b">Elaboración propia, síntesis del Corte 1 a partir de [1]–[5]. Ver referencias completas en README.md.</text>
  <text x="60" y="938" font-size="10" fill="#94a3b8" font-style="italic">Diagrama generado con asistencia de inteligencia artificial (Claude, Anthropic) [6].</text>
</svg>
