<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="900" fill="#f8fafc"/>

  <!-- Title -->
  <text x="550" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Marco conceptual: de la ciencia de datos a la decisión</text>
  <text x="550" y="66" text-anchor="middle" font-size="14" fill="#64748b">Aplicado al caso Spotify — capacidad de streaming y curaduría regional</text>

  <!-- Section 1: interdisciplinary venn -->
  <text x="550" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">1. Ciencia de datos como campo interdisciplinario [1]</text>

  <g opacity="0.85">
    <circle cx="470" cy="200" r="90" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="630" cy="200" r="90" fill="#1DB954" fill-opacity="0.35" stroke="#1DB954" stroke-width="1.5"/>
    <circle cx="550" cy="330" r="90" fill="#d97706" fill-opacity="0.35" stroke="#d97706" stroke-width="1.5"/>
  </g>
  <text x="410" y="165" font-size="12.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">Estadística y</text>
  <text x="410" y="181" font-size="12.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">matemáticas</text>
  <text x="690" y="165" font-size="12.5" font-weight="600" fill="#065f46" text-anchor="middle">Programación</text>
  <text x="690" y="181" font-size="12.5" font-weight="600" fill="#065f46" text-anchor="middle">(Python / SQL)</text>
  <text x="550" y="410" font-size="12.5" font-weight="600" fill="#92400e" text-anchor="middle">Conocimiento del dominio</text>
  <text x="550" y="426" font-size="12.5" font-weight="600" fill="#92400e" text-anchor="middle">(negocio de streaming)</text>
  <rect x="500" y="235" width="100" height="46" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="550" y="255" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Ciencia de</text>
  <text x="550" y="271" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Datos</text>

  <!-- Section 2: data-information-knowledge-decision chain -->
  <text x="550" y="475" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">2. Cadena de valor del dato [1]</text>

  <g font-size="12.5" font-weight="600">
    <rect x="60" y="495" width="200" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="160" y="516" text-anchor="middle" fill="#1e3a8a">Dato</text>
    <text x="160" y="533" text-anchor="middle" font-size="10.5" font-weight="400" fill="#334155">streams individuales</text>

    <line x1="260" y1="520" x2="300" y2="520" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>

    <rect x="300" y="495" width="200" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="400" y="516" text-anchor="middle" fill="#1e3a8a">Información</text>
    <text x="400" y="533" text-anchor="middle" font-size="10.5" font-weight="400" fill="#334155">horas por país/artista</text>

    <line x1="500" y1="520" x2="540" y2="520" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>

    <rect x="540" y="495" width="200" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="640" y="516" text-anchor="middle" fill="#1e3a8a">Conocimiento</text>
    <text x="640" y="533" text-anchor="middle" font-size="10.5" font-weight="400" fill="#334155">patrón estacional/regional</text>

    <line x1="740" y1="520" x2="780" y2="520" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>

    <rect x="780" y="495" width="200" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="880" y="516" text-anchor="middle" fill="#92400e">Decisión</text>
    <text x="880" y="533" text-anchor="middle" font-size="10.5" font-weight="400" fill="#334155">capacidad y curaduría</text>
  </g>

  <!-- Section 3: Big Data 3Vs feeding in -->
  <text x="550" y="605" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">3. Condición Big Data del caso [3]</text>
  <rect x="160" y="625" width="780" height="60" rx="10" fill="#ecfdf5" stroke="#1DB954" stroke-width="1.5"/>
  <text x="300" y="650" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Volumen</text>
  <text x="300" y="668" text-anchor="middle" font-size="11" fill="#334155">millones de reproducciones</text>
  <line x1="393" y1="635" x2="393" y2="675" stroke="#1DB954" stroke-width="1"/>
  <text x="550" y="650" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Velocidad</text>
  <text x="550" y="668" text-anchor="middle" font-size="11" fill="#334155">streams generados por segundo</text>
  <line x1="643" y1="635" x2="643" y2="675" stroke="#1DB954" stroke-width="1"/>
  <text x="790" y="650" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Variedad</text>
  <text x="790" y="668" text-anchor="middle" font-size="11" fill="#334155">usuario, canción, país, dispositivo</text>

  <line x1="550" y1="685" x2="550" y2="710" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>

  <!-- Section 4: analytics ladder -->
  <text x="550" y="740" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">4. Clasificación de la analítica aplicada [4]</text>

  <g font-size="12" font-weight="600">
    <rect x="60" y="760" width="230" height="55" rx="8" fill="#1DB954" fill-opacity="0.15" stroke="#1DB954" stroke-width="2"/>
    <text x="175" y="782" text-anchor="middle" fill="#065f46">Descriptiva ✓</text>
    <text x="175" y="800" text-anchor="middle" font-size="10.5" font-weight="400" fill="#334155">países/artistas top hoy</text>

    <rect x="310" y="760" width="230" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="425" y="782" text-anchor="middle" fill="#475569">Diagnóstica</text>
    <text x="425" y="800" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">no requerida en este caso</text>

    <rect x="560" y="760" width="230" height="55" rx="8" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2"/>
    <text x="675" y="782" text-anchor="middle" fill="#1e3a8a">Predictiva ✓</text>
    <text x="675" y="800" text-anchor="middle" font-size="10.5" font-weight="400" fill="#334155">forecast trimestral por país</text>

    <rect x="810" y="760" width="230" height="55" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="925" y="782" text-anchor="middle" fill="#92400e">Prescriptiva (opcional)</text>
    <text x="925" y="800" text-anchor="middle" font-size="10.5" font-weight="400" fill="#78350f">dónde invertir primero</text>
  </g>

  <!-- Footer -->
  <line x1="60" y1="845" x2="1040" y2="845" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="868" font-size="11.5" fill="#64748b">Elaboración propia a partir de la definición de ciencia de datos y su ciclo de proyecto [1], la caracterización</text>
  <text x="60" y="885" font-size="11.5" fill="#64748b">de Big Data por volumen, velocidad y variedad [3], y la taxonomía de analítica de negocio [4].</text>
</svg>
