<text x="414" y="196" text-anchor="start" font-size="12" font-weight="400" fill="#475569">formatos · tipos · duplicados</text>
<text x="414" y="222" text-anchor="start" font-size="12" font-weight="400" fill="#475569">faltantes · 0 en el CSV real</text>
<circle cx="402" cy="244" r="4" fill="#b45309"/>
<text x="414" y="248" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">368 años unificados</text>
<circle cx="402" cy="274" r="4" fill="#b45309"/>
<text x="414" y="278" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">2 filas imposibles fuera</text>
<text x="414" y="308" text-anchor="start" font-size="12" font-weight="400" fill="#475569">500 → 498 filas</text>
