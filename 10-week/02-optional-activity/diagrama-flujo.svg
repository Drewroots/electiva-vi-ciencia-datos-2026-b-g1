<text x="700.0" y="61" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b">Caso Spotify · cierre del Corte 2 · cada etapa reutiliza el trabajo de una semana anterior · pipeline_spotify.py</text>
<rect x="40" y="96" width="300" height="280" rx="12" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
