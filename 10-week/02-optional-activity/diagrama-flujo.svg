<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 590" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
<title>Flujo del mini-proyecto: modelo, extraer, limpiar, cargar y analizar</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="1400" height="590" fill="#f8fafc"/>
