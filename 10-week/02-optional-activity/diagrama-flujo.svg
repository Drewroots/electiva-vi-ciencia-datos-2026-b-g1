<text x="74" y="266" text-anchor="start" font-size="12" font-weight="400" fill="#475569">15 artistas · género</text>
<text x="74" y="292" text-anchor="start" font-size="12" font-weight="400" fill="#475569">coincidencia 100 % · caché</text>
