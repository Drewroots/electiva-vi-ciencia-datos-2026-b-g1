<text x="396" y="124" text-anchor="start" font-size="15" font-weight="700" fill="#ffffff">2 · LIMPIAR</text>
<text x="664" y="124" text-anchor="end" font-size="11.5" font-weight="700" fill="#ffffff">Semana 9</text>
<circle cx="402" cy="162" r="4" fill="#b45309"/>
