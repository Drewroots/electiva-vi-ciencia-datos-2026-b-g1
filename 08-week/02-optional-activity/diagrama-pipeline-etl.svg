<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 730" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Pipeline ETL del caso Spotify: fuentes, extraer, transformar, cargar y BI</title>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="730" fill="#f8fafc"/>

  <!-- ===== Título ===== -->
  <text x="700" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Pipeline ETL de extremo a extremo · caso Spotify</text>
  <text x="700" y="61" text-anchor="middle" font-size="13.5" fill="#64748b">Capacidad de streaming y curaduría regional · herramienta por etapa · ruta por lotes (batch) y ruta en tiempo real (streaming)</text>

  <!-- ===== Encabezados de etapa ===== -->
  <g font-size="12" font-weight="700" fill="#334155" text-anchor="middle">
    <circle cx="96" cy="96" r="10" fill="#0f172a"/><text x="96" y="100" fill="#ffffff" font-size="11">1</text><text x="150" y="100">FUENTES</text>
    <circle cx="343" cy="96" r="10" fill="#0f172a"/><text x="343" y="100" fill="#ffffff" font-size="11">2</text><text x="403" y="100">EXTRAER</text>
    <circle cx="612" cy="96" r="10" fill="#0f172a"/><text x="612" y="100" fill="#ffffff" font-size="11">3</text><text x="687" y="100">TRANSFORMAR</text>
    <circle cx="902" cy="96" r="10" fill="#0f172a"/><text x="902" y="100" fill="#ffffff" font-size="11">4</text><text x="955" y="100">CARGAR</text>
    <circle cx="1206" cy="96" r="10" fill="#0f172a"/><text x="1206" y="100" fill="#ffffff" font-size="11">5</text><text x="1256" y="100">BI</text>
  </g>

  <!-- ===== Orquestación (transversal a la ruta batch) ===== -->
  <rect x="30" y="116" width="1050" height="34" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="46" y="138" font-size="12" font-weight="700" fill="#9a3412">Apache Airflow [1]</text>
  <text x="178" y="138" font-size="11.5" fill="#7c2d12">orquesta la ruta batch: DAG diario (02:00) · orden Extraer → Transformar → Cargar · 3 reintentos y alerta si una fuente falla</text>

  <!-- ===================== RUTA BATCH ===================== -->
  <rect x="30" y="162" width="1050" height="14" rx="7" fill="#2563eb"/>
  <text x="44" y="172.5" font-size="10" font-weight="700" fill="#ffffff">RUTA POR LOTES (BATCH) · histórico y catálogo · alimenta el forecast y la curaduría</text>

  <!-- Fuente B1: histórico CSV -->
  <rect x="30" y="188" width="220" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Histórico CSV</text>
  <text x="44" y="230" font-size="11" fill="#334155">Kaggle [2] · 500 filas agregadas</text>
  <text x="44" y="245" font-size="11" fill="#334155">país × álbum × plan</text>
  <text x="44" y="260" font-size="11" fill="#334155">Estructurado (Semana 6)</text>

  <!-- Fuente B2: API catálogo -->
  <rect x="30" y="296" width="220" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">API de catálogo musical</text>
  <text x="44" y="338" font-size="11" fill="#334155">MusicBrainz [5] · HTTP + JSON</text>
  <text x="44" y="353" font-size="11" fill="#334155">artista, tipo, país, géneros</text>
  <text x="44" y="368" font-size="11" fill="#334155">Semiestructurado</text>

  <line x1="250" y1="234" x2="286" y2="234" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <line x1="250" y1="342" x2="286" y2="342" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aBlue)"/>

  <!-- Extraer batch -->
  <rect x="290" y="188" width="210" height="200" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="395" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Python [1]</text>
  <text x="395" y="229" text-anchor="middle" font-size="11" fill="#475569">pandas · requests</text>
  <text x="304" y="256" font-size="11" fill="#334155">• read_csv() del histórico</text>
  <text x="304" y="276" font-size="11" fill="#334155">• GET a la API → JSON</text>
  <text x="304" y="296" font-size="11" fill="#334155">• Extracción incremental:</text>
  <text x="316" y="311" font-size="11" fill="#334155">solo registros nuevos</text>
  <text x="304" y="331" font-size="11" fill="#334155">• Copia cruda en staging</text>
  <text x="316" y="346" font-size="11" fill="#334155">antes de transformar</text>

  <line x1="500" y1="288" x2="536" y2="288" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aBlue)"/>

  <!-- Transformar batch -->
  <rect x="540" y="188" width="270" height="200" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="675" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Python (pandas) + dbt [1]</text>
  <text x="675" y="229" text-anchor="middle" font-size="11" fill="#475569">limpiar · unir · calcular · validar [1]</text>
  <text x="554" y="256" font-size="11" fill="#334155">• Quitar duplicados y nulos</text>
  <text x="554" y="276" font-size="11" fill="#334155">• País → código ISO + región</text>
  <text x="554" y="296" font-size="11" fill="#334155">• Normalizar a 3FN (modelo Semana 6)</text>
  <text x="554" y="316" font-size="11" fill="#334155">• Completar género del artista</text>
  <text x="566" y="331" font-size="11" fill="#334155">con los datos de la API</text>
  <text x="554" y="351" font-size="11" fill="#334155">• Validar PK/FK y CHECK antes</text>
  <text x="566" y="366" font-size="11" fill="#334155">de cargar</text>

  <line x1="810" y1="288" x2="846" y2="288" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aBlue)"/>

  <!-- ===================== RUTA STREAMING ===================== -->
  <rect x="30" y="420" width="790" height="14" rx="7" fill="#16a34a"/>
  <text x="44" y="430.5" font-size="10" font-weight="700" fill="#ffffff">RUTA EN TIEMPO REAL (STREAMING) · eventos de reproducción · alimenta la decisión de capacidad</text>

  <!-- Fuente S1: eventos -->
  <rect x="30" y="446" width="220" height="157" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Eventos de reproducción</text>
  <text x="44" y="492" font-size="11" fill="#334155">Un JSON por cada stream:</text>
  <text x="44" y="510" font-size="11" fill="#334155">user_id, track_id, país,</text>
  <text x="44" y="525" font-size="11" fill="#334155">dispositivo, timestamp,</text>
  <text x="44" y="540" font-size="11" fill="#334155">segundos_escuchados</text>
  <text x="44" y="562" font-size="11" fill="#334155">Semiestructurado · llegan</text>
  <text x="44" y="577" font-size="11" fill="#334155">segundo a segundo</text>

  <line x1="250" y1="524" x2="286" y2="524" stroke="#16a34a" stroke-width="2.5" marker-end="url(#aGreen)"/>

  <!-- Extraer streaming: Kafka -->
  <rect x="290" y="446" width="210" height="157" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="395" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Apache Kafka [3]</text>
  <text x="395" y="487" text-anchor="middle" font-size="11" fill="#475569">ingesta de eventos</text>
  <text x="304" y="512" font-size="11" fill="#334155">• Recibe millones de eventos</text>
  <text x="316" y="527" font-size="11" fill="#334155">con baja latencia</text>
  <text x="304" y="547" font-size="11" fill="#334155">• Retiene el flujo: lo leen</text>
  <text x="316" y="562" font-size="11" fill="#334155">consumidores en línea y</text>
  <text x="316" y="577" font-size="11" fill="#334155">procesos por lotes</text>

  <line x1="500" y1="524" x2="536" y2="524" stroke="#16a34a" stroke-width="2.5" marker-end="url(#aGreen)"/>

  <!-- Transformar streaming: Spark -->
  <rect x="540" y="446" width="270" height="157" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="675" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Spark Structured Streaming [4]</text>
  <text x="675" y="487" text-anchor="middle" font-size="11" fill="#475569">transformación incremental</text>
  <text x="554" y="512" font-size="11" fill="#334155">• Validar el esquema del JSON</text>
  <text x="554" y="532" font-size="11" fill="#334155">• Filtrar bots y duplicados:</text>
  <text x="566" y="547" font-size="11" fill="#334155">segundos_escuchados ≤ duración</text>
  <text x="554" y="567" font-size="11" fill="#334155">• Sumar horas por país en</text>
  <text x="566" y="582" font-size="11" fill="#334155">ventanas de 1 minuto</text>

  <line x1="810" y1="470" x2="846" y2="470" stroke="#16a34a" stroke-width="2.5" marker-end="url(#aGreen)"/>

  <!-- Copia cruda Kafka → Data Lake -->
  <path d="M395,603 L395,628 L965,628 L965,607" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <rect x="560" y="619" width="230" height="18" rx="4" fill="#f8fafc"/>
  <text x="675" y="632" text-anchor="middle" font-size="10.5" font-style="italic" fill="#475569">copia cruda de cada evento (sin transformar)</text>

  <!-- ===================== CARGAR ===================== -->
  <!-- Data Warehouse -->
  <rect x="850" y="188" width="230" height="310" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="965" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Data Warehouse</text>
  <text x="965" y="229" text-anchor="middle" font-size="11" fill="#475569">PostgreSQL · esquema Semana 6</text>

  <rect x="862" y="242" width="206" height="118" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="874" y="261" font-size="11" font-weight="700" fill="#1e3a8a">Carga por lotes (upsert)</text>
  <text x="874" y="281" font-size="10.5" fill="#334155">pais · genero · artista</text>
  <text x="874" y="297" font-size="10.5" fill="#334155">album · plan_suscripcion</text>
  <text x="874" y="313" font-size="10.5" fill="#334155">metrica_streaming</text>
  <text x="874" y="335" font-size="10.5" fill="#475569">Solo entra lo que pasó</text>
  <text x="874" y="350" font-size="10.5" fill="#475569">la validación</text>

  <rect x="862" y="372" width="206" height="114" rx="7" fill="#f0fdf4" stroke="#86efac"/>
  <text x="874" y="391" font-size="11" font-weight="700" fill="#14532d">Carga continua (append)</text>
  <text x="874" y="411" font-size="10.5" fill="#334155">demanda_minuto</text>
  <text x="874" y="427" font-size="10.5" fill="#334155">(país, minuto, horas)</text>
  <text x="874" y="449" font-size="10.5" fill="#475569">Una fila nueva por país</text>
  <text x="874" y="464" font-size="10.5" fill="#475569">cada minuto</text>

  <!-- Data Lake -->
  <rect x="850" y="514" width="230" height="89" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="965" y="537" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Data Lake (crudo)</text>
  <text x="864" y="557" font-size="11" fill="#334155">JSON originales para auditoría</text>
  <text x="864" y="572" font-size="11" fill="#334155">y reproceso; la ruta batch los</text>
  <text x="864" y="587" font-size="11" fill="#334155">consolida cada noche</text>

  <line x1="1080" y1="300" x2="1116" y2="300" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <line x1="1080" y1="430" x2="1116" y2="430" stroke="#16a34a" stroke-width="2.5" marker-end="url(#aGreen)"/>

  <!-- ===================== BI ===================== -->
  <rect x="1120" y="188" width="250" height="415" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="1245" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Power BI [1]</text>
  <text x="1245" y="229" text-anchor="middle" font-size="11" fill="#475569">tableros para dos equipos</text>

  <rect x="1134" y="244" width="222" height="132" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1146" y="265" font-size="12" font-weight="700" fill="#1e3a8a">Forecast y curaduría</text>
  <text x="1146" y="284" font-size="10.5" fill="#475569">Actualización diaria</text>
  <text x="1146" y="306" font-size="11" fill="#334155">Tendencia de horas por país</text>
  <text x="1146" y="321" font-size="11" fill="#334155">y artistas top por región</text>
  <text x="1146" y="347" font-size="11" font-weight="700" fill="#1e3a8a">→ Marketing / Contenido:</text>
  <text x="1146" y="362" font-size="11" fill="#1e3a8a">priorizar artistas y álbumes</text>

  <rect x="1134" y="388" width="222" height="132" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1146" y="409" font-size="12" font-weight="700" fill="#14532d">Capacidad en vivo</text>
  <text x="1146" y="428" font-size="10.5" fill="#475569">Actualización cada minuto</text>
  <text x="1146" y="450" font-size="11" fill="#334155">Horas por país y alerta si</text>
  <text x="1146" y="465" font-size="11" fill="#334155">superan el umbral de carga</text>
  <text x="1146" y="491" font-size="11" font-weight="700" fill="#14532d">→ Infraestructura / DevOps:</text>
  <text x="1146" y="506" font-size="11" fill="#14532d">escalar servidores y CDN</text>

  <text x="1245" y="548" text-anchor="middle" font-size="10.5" fill="#64748b">Responde la pregunta del caso:</text>
  <text x="1245" y="563" text-anchor="middle" font-size="10.5" fill="#64748b">¿dónde y cuándo crecerá la</text>
  <text x="1245" y="578" text-anchor="middle" font-size="10.5" fill="#64748b">demanda de streaming?</text>

  <!-- ===================== Leyenda ===================== -->
  <line x1="30" y1="660" x2="1370" y2="660" stroke="#e2e8f0" stroke-width="1"/>
  <g font-size="11" fill="#334155">
    <line x1="40" y1="686" x2="76" y2="686" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aBlue)"/>
    <text x="86" y="690">Lote (batch): datos que cambian lento; corre una vez al día</text>
    <line x1="430" y1="686" x2="466" y2="686" stroke="#16a34a" stroke-width="2.5" marker-end="url(#aGreen)"/>
    <text x="476" y="690">Flujo (streaming): eventos continuos; latencia de segundos</text>
    <line x1="820" y1="686" x2="856" y2="686" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
    <text x="866" y="690">Copia cruda para reproceso</text>
    <rect x="1050" y="677" width="30" height="16" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-dasharray="4 3"/>
    <text x="1090" y="690">Orquestación</text>
  </g>
  <text x="30" y="716" font-size="10.5" fill="#94a3b8">[n] = referencia del documento (README de la Semana 8). Las tablas del Data Warehouse corresponden al modelo normalizado de la Semana 6.</text>
</svg>
